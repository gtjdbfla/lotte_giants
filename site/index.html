<!doctype html>
<html lang="ko">
<head>

<body>

  <main>
    <section class="intro"><div class="eyebrow">THE HOPE & HEARTBREAK ARCHIVE</div><h1>분명 이길 줄 알았는데</h1><p>못한 정도 말고, 희망을 줬다 뺏은 정도<br class="mobile"> 그날의 스트레스를 다시 꺼내봅니다</p></section>
    <nav class="tabs" role="tablist" aria-label="연구 대상"><button id="teams-tab" role="tab" aria-controls="teams-panel" aria-selected="true" tabindex="0" data-tab="teams"><span>01</span> 구단별 희망고문</button><button id="players-tab" role="tab" aria-controls="players-panel" aria-selected="false" tabindex="-1" data-tab="players"><span>02</span> 롯데 선수 꼴데력</button></nav>
    <div class="toolbar"><div><span class="live-dot"></span><span id="coverage-line">기록 불러오는 중</span></div><label>시즌 <select id="season" aria-label="시즌 선택"><option value="2025">2025 시즌</option><option value="2024">2024 시즌</option><option value="all">2024–2025 전체</option></select></label></div>
    <div id="status" role="status" class="loading">경기 기록을 펼치고 있습니다</div>

  </main>
  <footer><span>꼴데연구소 <strong>GGOLDE LAB</strong></span><p>팬의 감정을 복기하는 비공식 연구 프로젝트<br>선수의 실력·인성·미래 성적을 평가하는 지표가 아닙니다</p><a href="https://github.com/gtjdbfla/lotte_giants" target="_blank" rel="noopener noreferrer">코드와 연구 기록 ↗</a></footer>
